services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TURNOS_DB_NAME}
      POSTGRES_USER: ${TURNOS_DB_USER}
      POSTGRES_PASSWORD: ${TURNOS_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  turnos:
    build: .
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      TURNOS_DB_NAME: ${TURNOS_DB_NAME}
      TURNOS_DB_USER: ${TURNOS_DB_USER}
      TURNOS_DB_PASSWORD: ${TURNOS_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CATALOGO_BASE_URL: ${CATALOGO_BASE_URL}
      # Parámetros de ajuste opcionales: el valor por defecto está en application.properties. Sin valor aquí, Compose
      # los pasa solo si están definidos en el shell o en el .env, y en ese caso ganan
      CATALOGO_CONNECT_TIMEOUT:
      CATALOGO_READ_TIMEOUT:
      CATALOGO_MAX_ATTEMPTS:
      CATALOGO_INITIAL_BACKOFF:
    # Catálogo corre en su propio compose y publica su puerto en el host: así el contenedor lo alcanza (en Linux
    # host.docker.internal no existe sin esto)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${TURNOS_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
