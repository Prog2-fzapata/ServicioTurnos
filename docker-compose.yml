services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TURNOS_DB_NAME}
      POSTGRES_USER: ${TURNOS_DB_USER}
      POSTGRES_PASSWORD: ${TURNOS_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  turnos:
    build: .
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      TURNOS_DB_NAME: ${TURNOS_DB_NAME}
      TURNOS_DB_USER: ${TURNOS_DB_USER}
      TURNOS_DB_PASSWORD: ${TURNOS_DB_PASSWORD}
    ports:
      - "127.0.0.1:${TURNOS_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
