# Kafka ficticio solo para los tests, con los nombres de las variables de entorno. El listener no arranca solo: el
# contexto no debe intentar conectarse a ningún broker; el test que lo necesita lo activa y usa uno real (Testcontainers)
CATEDRA_KAFKA_BOOTSTRAP_SERVERS=kafka.test:9092
CATEDRA_KAFKA_GROUP_ID=grupo-de-prueba
CATEDRA_KAFKA_APPOINTMENT_ACTIONS_TOPIC=topic-de-prueba
spring.kafka.listener.auto-startup=false
