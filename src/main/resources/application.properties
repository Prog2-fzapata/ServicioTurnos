spring.application.name=turnos
server.port=${TURNOS_PORT:8082}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${TURNOS_DB_NAME}
spring.datasource.username=${TURNOS_DB_USER}
spring.datasource.password=${TURNOS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# JWT: turnos solo valida; la clave en Base64 es la misma con que firma catálogo
jwt.secret=${JWT_SECRET}

# Catálogo: la URL es obligatoria; timeouts y reintentos tienen valor por defecto y la variable de entorno gana
catalogo.base-url=${CATALOGO_BASE_URL}
catalogo.connect-timeout=${CATALOGO_CONNECT_TIMEOUT:2s}
catalogo.read-timeout=${CATALOGO_READ_TIMEOUT:3s}
catalogo.max-attempts=${CATALOGO_MAX_ATTEMPTS:3}
catalogo.initial-backoff=${CATALOGO_INITIAL_BACKOFF:200ms}

# Cátedra: la URL y el JWT técnico son obligatorios; timeouts y reintentos tienen valor por defecto y el entorno gana
catedra.base-url=${CATEDRA_BASE_URL}
catedra.jwt=${CATEDRA_JWT}
catedra.connect-timeout=${CATEDRA_CONNECT_TIMEOUT:2s}
catedra.read-timeout=${CATEDRA_READ_TIMEOUT:5s}
catedra.max-attempts=${CATEDRA_MAX_ATTEMPTS:3}
catedra.initial-backoff=${CATEDRA_INITIAL_BACKOFF:200ms}

# Disponibilidad: zona de los horarios de atención y rango máximo (parámetros de ajuste; el entorno gana)
availability.zone=${AVAILABILITY_ZONE:America/Argentina/Mendoza}
availability.max-range-days=${AVAILABILITY_MAX_RANGE_DAYS:31}

# Reservas: intentos ante un conflicto de versión y para conseguir un hold confirmado (parámetros de ajuste; el entorno gana)
reservation.conflict-max-attempts=${RESERVATION_CONFLICT_MAX_ATTEMPTS:3}
reservation.hold-max-attempts=${RESERVATION_HOLD_MAX_ATTEMPTS:2}

# Listas paginadas: tamaño máximo de página (un size mayor se reduce a este valor); el tamaño por defecto es 20
spring.data.web.pageable.max-page-size=${RESERVATION_PAGE_MAX_SIZE:100}

# Kafka de la cátedra (consume los eventos de reserva): servidores, grupo y topic son obligatorios. El servidor es la
# IP de la cátedra en ZeroTier (ver A12). El offset se confirma a mano, después del COMMIT de la base. Sin offset
# guardado se empieza por el principio: un evento publicado antes de que el grupo exista no debe perderse
spring.kafka.bootstrap-servers=${CATEDRA_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=${CATEDRA_KAFKA_GROUP_ID}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=manual
catedra.kafka.appointment-actions-topic=${CATEDRA_KAFKA_APPOINTMENT_ACTIONS_TOPIC}
# El teléfono se publica en el topic de teléfono; el groupId de la cuenta es un campo obligatorio del mensaje
catedra.kafka.appointment-phone-topic=${CATEDRA_KAFKA_APPOINTMENT_PHONE_TOPIC}
catedra.kafka.account-group-id=${CATEDRA_GROUP_ID}
# Productor: el ack es del broker con todas las réplicas y la idempotencia evita duplicar un reenvío del productor (D12)
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Reintentos ante un fallo al procesar un evento (parámetros de ajuste; el entorno gana)
catedra.kafka.max-retries=${CATEDRA_KAFKA_MAX_RETRIES:3}
catedra.kafka.initial-backoff=${CATEDRA_KAFKA_INITIAL_BACKOFF:1s}

# Relay del outbox (publica el teléfono): cada cuánto mira, cuántos mensajes toma por vuelta y cuánto espera el ack de
# Kafka (parámetros de ajuste; el entorno gana)
outbox.relay-interval=${OUTBOX_RELAY_INTERVAL:1s}
outbox.relay-batch-size=${OUTBOX_RELAY_BATCH_SIZE:50}
outbox.publish-timeout=${OUTBOX_PUBLISH_TIMEOUT:10s}
